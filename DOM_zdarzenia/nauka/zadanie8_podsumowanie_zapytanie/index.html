<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nauka – podsumowanie zapytanie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Zapytanie o produkt</h1>
        <form id="formularz">
            <label for="produkt">Nazwa:</label>
            <input id="produkt" type="text" autocomplete="off">
            <p>Podgląd: <span id="podglad">—</span></p>
            <button type="submit">Wyślij</button>
            <button type="button" id="wyczysc">Wyczyść</button>
        </form>
        <p id="status"></p>
    </div>
    <footer><p>Imię i nazwisko, klasa</p></footer>
    <script src="script.js"></script>
</body>
</html>
